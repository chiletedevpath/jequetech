<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solicitud no disponible · JequeTech</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
  <body>
    <main class="container py-5">
      <div class="card p-5 mx-auto" style="max-width: 640px">
        <div class="eyebrow" th:text="'SOLICITUD ' + ${status}"></div>
        <h1
          class="mt-3"
          th:text="${status == 404 ? 'No encontramos ese registro' : status == 403 ? 'Acceso no permitido' : 'No se pudo completar la solicitud'}"
        ></h1>
        <p
          th:text="${mensaje != null ? mensaje : 'Revisa la dirección, tus permisos o los datos enviados. Si tu sesión venció, vuelve a ingresar.'}"
        ></p>
        <div class="d-flex gap-2 flex-wrap">
          <a class="btn btn-primary" th:href="@{/dashboard}">Ir al panel</a
          ><a class="btn btn-outline-secondary" th:href="@{/login}"
            >Iniciar sesión</a
          >
        </div>
      </div>
    </main>
  </body>
</html>

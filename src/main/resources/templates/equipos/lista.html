<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page('Equipos', ~{::main})}"
>
  <body>
    <main>
      <div class="page-heading">
        <div>
          <div class="eyebrow">DIRECTORIO</div>
          <h1>Equipos</h1>
          <p>Dispositivos registrados y su historial de atenciones.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/equipos/nuevo}"
          >+ Nuevo equipo</a
        >
      </div>
      <section class="card">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <caption class="visually-hidden">
              Equipos
            </caption>
            <thead>
              <tr>
                <th scope="col">Equipo</th>
                <th scope="col">Serie</th>
                <th scope="col">Propietario</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${registros}">
                <td th:text="${r.descripcion()}"></td>
                <td th:text="${r.numeroSerie}"></td>
                <td
                  th:text="${catalogos.cliente(r.clienteId).nombreCompleto()}"
                ></td>
                <td>
                  <div class="d-flex gap-2">
                    <a
                      class="btn btn-sm btn-light"
                      th:href="@{/equipos/{id}/editar(id=${r.id})}"
                      >Editar</a
                    ><a
                      class="btn btn-sm btn-light"
                      th:href="@{/equipos/{id}/historial(id=${r.id})}"
                      >Historial</a
                    >
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(registros)}">
                <td colspan="7" class="empty-state">Aún no hay registros.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>

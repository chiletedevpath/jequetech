<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="page(titulo,contenido)"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${titulo} + ' · JequeTech'">JequeTech</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml" />
    <link rel="stylesheet" th:href="@{/vendor/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/vendor/bootstrap.bundle.min.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="app-shell">
      <aside
        class="sidebar offcanvas-lg offcanvas-start"
        tabindex="-1"
        id="menu"
        aria-labelledby="menuTitulo"
      >
        <div class="offcanvas-header">
          <h2 class="h5" id="menuTitulo">Navegación</h2>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            data-bs-target="#menu"
            aria-label="Cerrar menú"
          ></button>
        </div>
        <a
          class="brand"
          th:href="@{/dashboard}"
          aria-label="JequeTech, ir al panel"
          ><img
            th:src="@{/img/jequetech-logo.png}"
            alt="JequeTech Solutions S.A.C."
        /></a>
        <div class="offcanvas-body sidebar-body">
          <div class="nav-caption">ESPACIO DE TRABAJO</div>
          <nav class="nav flex-column" aria-label="Navegación principal">
            <a
              class="nav-link"
              th:classappend="${rutaActual == '/dashboard'} ? 'active'"
              th:href="@{/dashboard}"
              ><svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <rect x="3" y="3" width="7" height="7" rx="1" />
                <rect x="14" y="3" width="7" height="7" rx="1" />
                <rect x="3" y="14" width="7" height="7" rx="1" />
                <rect x="14" y="14" width="7" height="7" rx="1" />
              </svg>
              Panel principal</a
            >
            <a
              class="nav-link"
              th:classappend="${#strings.startsWith(rutaActual,'/ordenes')} ? 'active'"
              th:href="@{/ordenes}"
              ><svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <rect x="5" y="3" width="14" height="18" rx="2" />
                <path d="M9 8h6M9 12h6M9 16h4" /></svg
              ><span
                th:text="${esTecnico} ? 'Mis órdenes' : 'Órdenes de servicio'"
                >Órdenes</span
              ></a
            >
            <a
              th:if="${esRecepcion}"
              class="nav-link"
              th:classappend="${rutaActual == '/seguimiento'} ? 'active'"
              th:href="@{/seguimiento}"
              ><svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5l3 2" />
              </svg>
              Seguimiento</a
            >
            <a
              th:if="${esRecepcion}"
              class="nav-link"
              th:classappend="${#strings.startsWith(rutaActual,'/clientes')} ? 'active'"
              th:href="@{/clientes}"
              ><svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <circle cx="9" cy="8" r="3" />
                <path
                  d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"
                />
              </svg>
              Clientes</a
            >
            <a
              th:if="${esRecepcion}"
              class="nav-link"
              th:classappend="${#strings.startsWith(rutaActual,'/equipos')} ? 'active'"
              th:href="@{/equipos}"
              ><svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <rect x="3" y="4" width="18" height="12" rx="2" />
                <path d="M12 16v4M8 20h8" />
              </svg>
              Equipos</a
            >
            <a
              th:if="${esAdmin}"
              class="nav-link"
              th:classappend="${#strings.startsWith(rutaActual,'/tecnicos')} ? 'active'"
              th:href="@{/tecnicos}"
              ><svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <path
                  d="M14 5a5 5 0 0 0-6 6L3 16a3 3 0 0 0 4 4l5-5a5 5 0 0 0 7-6l-3 3-4-4z"
                />
              </svg>
              Técnicos</a
            >
            <a
              th:if="${esAdmin}"
              class="nav-link"
              th:classappend="${#strings.startsWith(rutaActual,'/usuarios')} ? 'active'"
              th:href="@{/usuarios}"
              ><svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                aria-hidden="true"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
              </svg>
              Usuarios</a
            >
          </nav>
          <div class="sidebar-bottom">
            <span class="live-dot"></span> Gestión de servicio técnico
            <p>Los datos se conservan al reiniciar.</p>
            <div class="small">Chilete · Valle del Jequetepeque</div>
          </div>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar navbar">
          <div class="d-flex align-items-center gap-3">
            <button
              class="btn btn-outline-secondary d-lg-none"
              type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#menu"
              aria-controls="menu"
              aria-label="Abrir menú"
            >
              ☰</button
            ><span class="topbar-label">Gestión de servicio técnico</span>
          </div>
          <div th:if="${actor != null}" class="d-flex align-items-center gap-3">
            <div class="user-info">
              <strong th:text="${actor.nombre}"></strong
              ><small th:text="${actor.rol.etiqueta}"></small>
            </div>
            <form th:action="@{/logout}" method="post"><button class="btn btn-sm btn-outline-secondary">Salir</button>
            </form>
          </div>
        </header>
        <div class="content-wrap" id="contenido">
          <div
            th:if="${exito}"
            class="alert alert-success"
            role="status"
            th:text="${exito}"
          ></div>
          <div
            th:if="${error}"
            class="alert alert-danger"
            role="alert"
            th:text="${error}"
          ></div>
          <main th:replace="${contenido}"></main>
        </div>
        <footer class="app-footer">
          <span>JequeTech Solutions S.A.C.</span>
        </footer>
      </div>
    </div>
  </body>
</html>

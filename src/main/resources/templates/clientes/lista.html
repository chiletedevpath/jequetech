<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page('Clientes', ~{::main})}"
>
  <body>
    <main>
      <div class="page-heading">
        <div>
          <div class="eyebrow">DIRECTORIO</div>
          <h1>Clientes</h1>
          <p>Personas y empresas que confían sus equipos a JequeTech.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/clientes/nuevo}"
          >+ Nuevo cliente</a
        >
      </div>
      <section class="card">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <caption class="visually-hidden">
              Clientes
            </caption>
            <thead>
              <tr>
                <th scope="col">Cliente</th>
                <th scope="col">Documento</th>
                <th scope="col">Teléfono</th>
                <th scope="col">Correo</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${registros}">
                <td th:text="${r.nombreCompleto()}"></td>
                <td th:text="${r.documento}"></td>
                <td th:text="${r.telefono}"></td>
                <td th:text="${r.correo}"></td>
                <td>
                  <div class="d-flex gap-2">
                    <a
                      class="btn btn-sm btn-light"
                      th:href="@{/clientes/{id}/editar(id=${r.id})}"
                      >Editar</a
                    >
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(registros)}">
                <td colspan="7" class="empty-state">Aún no hay registros.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>

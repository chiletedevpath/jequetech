<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: page('Usuarios', ~{::main})}"
>
  <body>
    <main>
      <div class="page-heading">
        <div>
          <div class="eyebrow">DIRECTORIO</div>
          <h1>Usuarios</h1>
          <p>Cuentas de acceso y funciones dentro del sistema.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}"
          >+ Nuevo usuario</a
        >
      </div>
      <section class="card">
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <caption class="visually-hidden">
              Usuarios
            </caption>
            <thead>
              <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Correo</th>
                <th scope="col">Rol</th>
                <th scope="col">Estado</th>
                <th scope="col">Técnico</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="r : ${registros}">
                <td th:text="${r.nombre}"></td>
                <td th:text="${r.correo}"></td>
                <td th:text="${r.rol.etiqueta}"></td>
                <td th:text="${r.activo ? 'Activo' : 'Inactivo'}"></td>
                <td
                  th:text="${r.tecnicoId != null ? catalogos.tecnico(r.tecnicoId).nombres : 'No corresponde'}"
                ></td>
                <td>
                  <div class="d-flex gap-2">
                    <a
                      class="btn btn-sm btn-light"
                      th:href="@{/usuarios/{id}/editar(id=${r.id})}"
                      >Editar</a
                    >
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(registros)}">
                <td colspan="7" class="empty-state">Aún no hay registros.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
